<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a84ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trip Track">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com; font-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Trip Track · 旅程记录</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/v1789479134/app.css">
</head>
<body>
  <div id="map"></div>

  <header class="tt-topbar">
    <div class="tt-brand">✈️ Trip Track <span class="count" id="tripCount"></span></div>
    <div class="tt-spacer"></div>
    <button id="locateBtn" class="tt-iconbtn" type="button" aria-label="定位当前位置" hidden>◎</button>
    <button id="menuBtn" class="tt-iconbtn" type="button" aria-label="菜单">⋯</button>
  </header>

  <button id="fabBtn" class="tt-fab" type="button" aria-label="新增旅程" hidden>+</button>

  <!-- 解锁 / 首次设置 -->
  <div id="authOverlay" class="tt-overlay tt-center">
    <section class="tt-sheet">
      <div class="tt-grabber"></div>
      <h2 id="authTitle">解锁 Trip Track</h2>
      <p class="sub" id="authSub">输入解锁密码，从仓库读取加密的旅程数据。</p>
      <!-- GET 真实提交以触发浏览器「保存密码」；敏感输入不带 name，不会进入 URL -->
      <form id="authForm" action="./" method="get" autocomplete="on">
        <input type="text" id="ttUser" name="ttUser" autocomplete="username"
               class="visually-hidden" aria-hidden="true" tabindex="-1">
        <div class="tt-field">
          <label for="authPass">解锁密码</label>
          <input id="authPass" type="password" autocomplete="current-password"
                 placeholder="密码" required>
        </div>
        <div id="setupFields" hidden>
          <div class="tt-field">
            <label for="authPass2">确认密码</label>
            <input id="authPass2" type="password" autocomplete="new-password" placeholder="再输入一次">
          </div>
          <div class="tt-field">
            <label for="authToken">GitHub Token（fine-grained PAT，仅授权本仓库 Contents 读写）</label>
            <input id="authToken" type="password" autocomplete="off"
                   placeholder="github_pat_…" spellcheck="false" autocapitalize="off">
          </div>
          <div class="tt-field">
            <label for="authRepo">目标仓库 URL（可选，默认本仓库）</label>
            <input id="authRepo" type="text" autocomplete="off"
                   placeholder="https://github.com/owner/repo" spellcheck="false" autocapitalize="off">
          </div>
        </div>
        <div class="tt-actions">
          <button type="submit" class="tt-btn tt-btn-primary" id="authSubmit">解锁</button>
        </div>
        <button type="button" class="tt-mode-switch" id="modeSwitch">首次使用？设置 Token 和密码</button>
      </form>
    </section>
  </div>

  <!-- 新增旅程表单 -->
  <div id="formOverlay" class="tt-overlay" hidden>
    <section class="tt-sheet">
      <div class="tt-grabber"></div>
      <h2>记录一段旅程</h2>
      <div class="tt-leg">
        <p class="tt-leg-title">出发</p>
        <div class="tt-field">
          <label for="fromIata">出发机场（IATA 三字码，如 PEK）</label>
          <input id="fromIata" list="airportList" placeholder="PEK" required
                 spellcheck="false" autocapitalize="characters" maxlength="3">
        </div>
        <div class="tt-row">
          <div class="tt-field">
            <label for="fromDate">日期</label>
            <input id="fromDate" type="date" required>
          </div>
          <div class="tt-field">
            <label for="fromTime">时间</label>
            <input id="fromTime" type="time" required>
          </div>
        </div>
      </div>
      <div class="tt-leg">
        <p class="tt-leg-title">到达</p>
        <div class="tt-field">
          <label for="toIata">到达机场（IATA 三字码）</label>
          <input id="toIata" list="airportList" placeholder="SHA" required
                 spellcheck="false" autocapitalize="characters" maxlength="3">
        </div>
        <div class="tt-row">
          <div class="tt-field">
            <label for="toDate">日期</label>
            <input id="toDate" type="date" required>
          </div>
          <div class="tt-field">
            <label for="toTime">时间</label>
            <input id="toTime" type="time" required>
          </div>
        </div>
      </div>
      <div class="tt-field">
        <label for="flightNo">航班号</label>
        <input id="flightNo" type="text" placeholder="CA1234" required
               spellcheck="false" autocapitalize="characters">
      </div>
      <div class="tt-field">
        <label for="noteText">备注</label>
        <textarea id="noteText" maxlength="1000" rows="4"
                  placeholder="这次旅程的记录…（最多 1000 字符）"></textarea>
        <div class="tt-char-count"><span id="noteCount">0</span>/1000</div>
      </div>
      <datalist id="airportList"></datalist>
      <div class="tt-actions">
        <button type="button" class="tt-btn tt-btn-secondary" id="formCancel">取消</button>
        <button type="button" class="tt-btn tt-btn-primary" id="formSave">保存到仓库</button>
      </div>
    </section>
  </div>

  <div id="toast" class="tt-toast" hidden></div>
  <div id="busyMask" class="tt-busy-mask" hidden><div class="tt-spinner"></div></div>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="assets/v1789479134/gh.js"></script>
  <script src="assets/v1789479134/enc.js"></script>
  <script src="assets/v1789479134/airports.js"></script>
  <script src="assets/v1789479134/geo.js"></script>
  <script src="assets/v1789479134/app.js"></script>
  <script src="./pwa-register.js"></script>
</body>
</html>
