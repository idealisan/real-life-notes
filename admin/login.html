<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>连接 · 管理后台</title>
  <link rel="stylesheet" href="../assets/v1786081086/base.css">
  <link rel="stylesheet" href="../assets/v1786081086/admin.css">
  <script src="../assets/v1786081086/theme.js"></script>
</head>
<body class="admin-page">
  <main class="container" style="max-width:560px;padding-top:56px;padding-bottom:56px">
    <section class="panel">
      <h2 class="panel-title">📝 连接管理后台</h2>
      <p class="hint" style="margin:0 0 16px">
        填写 GitHub Token 后点击提交：浏览器会弹出「保存密码」提示，保存后下次打开可自动填充并一键进入后台。
      </p>
      <form id="loginForm" action="./index.html" method="post" autocomplete="on">
        <input type="text" name="adminUser" autocomplete="username"
               class="visually-hidden" aria-hidden="true" tabindex="-1">
        <div class="field">
          <label for="adminToken">GitHub Token（fine-grained PAT，仅授权本仓库 Contents 读写）</label>
          <input id="adminToken" name="adminToken" type="password" autocomplete="current-password"
                 placeholder="github_pat_…" required spellcheck="false" autocapitalize="off">
        </div>
        <div class="field">
          <label for="adminRepo">目标仓库 URL（可选）</label>
          <input id="adminRepo" name="adminRepo" type="text" autocomplete="off"
                 placeholder="https://github.com/owner/repo" spellcheck="false" autocapitalize="off">
        </div>
        <button type="submit" class="btn-primary">连接并进入后台</button>
      </form>
    </section>
  </main>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('loginForm');
      var userEl = form.elements.adminUser;
      try {
        var savedRepo = sessionStorage.getItem('adminRepo');
        if (savedRepo) form.elements.adminRepo.value = savedRepo;
      } catch (e) {}
      form.addEventListener('submit', function () {
        try {
          sessionStorage.setItem('adminToken', form.elements.adminToken.value.trim());
          sessionStorage.setItem('adminRepo', form.elements.adminRepo.value.trim());
          var s = form.elements.adminRepo.value.trim().replace(/\/+$/, '');
          var parts = s ? s.split('/').filter(Boolean) : [];
          userEl.value = parts.length >= 2 ? parts[parts.length - 2] : 'github';
        } catch (e) {}
        // 不调用 preventDefault：让表单真实提交并跳转到 index.html，
        // 通过真实页面跳转触发浏览器「保存密码」提示。
      });
    })();
  </script>
</body>
</html>
