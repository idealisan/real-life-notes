<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="管理后台">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com; font-src 'self'; base-uri 'self'; form-action 'self'">
  <title>管理后台 · Real Life Notes</title>
  <link rel="stylesheet" href="../assets/v1786199851/base.css">
  <link rel="stylesheet" href="../assets/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="../assets/vendor/hljs/github.min.css" data-hljs="light" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="../assets/vendor/hljs/github-dark.min.css" data-hljs="dark" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="../assets/v1786199851/admin.css">
  <script src="../assets/v1786199851/theme.js"></script>
</head>
<body class="admin-page">

  <!-- 连接横幅 -->
  <section class="connect-view" id="connectView" hidden>
    <div class="container connect-bar">
      <div class="connect-brand">
        <span class="connect-logo">📝</span>
        <span class="connect-title">管理后台</span>
      </div>
        <form id="connectForm" class="connect-form" action="./" method="get" autocomplete="on">
          <!-- 供密码管理器识别用户名的隐藏字段：提交时由 JS 填仓库 owner，让浏览器能正确提示保存 Token -->
          <input id="adminUser" name="adminUser" type="text" autocomplete="username"
                 aria-hidden="true" tabindex="-1" class="visually-hidden">
          <input id="adminToken" name="adminToken" type="password"
                 aria-label="GitHub Token"
                 autocomplete="current-password" placeholder="GitHub Token (github_pat_…)"
                 required spellcheck="false" autocapitalize="off">
          <input id="adminRepo" name="adminRepo" type="text"
                 aria-label="目标仓库 URL（可选）"
                 autocomplete="off"
                 placeholder="目标仓库 URL（可选）"
                 spellcheck="false" autocapitalize="off">
          <button type="submit" class="btn-primary" id="connectBtn">连接</button>
        </form>
        <form id="unlockForm" class="connect-form" autocomplete="on" hidden>
          <input id="unlockPass" name="unlockPass" type="password"
                 aria-label="解锁密码" autocomplete="current-password"
                 placeholder="解锁密码" required spellcheck="false">
          <button type="submit" class="btn-primary" id="unlockBtn">解锁并连接</button>
        </form>
        <div class="connect-msgs">
          <p class="connect-tip" id="connectTip">Token 仅在浏览器内存使用，不落盘。若浏览器未自动弹出「保存密码」，可在浏览器密码管理器中手动添加：网址 = 本页面，用户名 = GitHub 用户名，密码 = Token。</p>
          <p class="connect-tip" id="unlockTip" hidden>检测到仓库中已保存的加密 Token，输入密码解锁后连接，无需再粘贴 Token。</p>
          <p class="connect-hint" id="connectRepoHint" hidden></p>
          <p class="connect-target" id="connectTarget" hidden>
            目标仓库：<code id="connectTargetText"></code>
          </p>
          <p class="connect-error" id="connectError" hidden></p>
          <p class="connect-meta" id="connectMeta" hidden></p>
          <p class="connect-hint">
            <a href="#" id="modeToggle" hidden></a>
          </p>
          <p class="connect-hint">
            <a href="./login.html" class="connect-login-link">使用独立登录页登录</a>
          </p>
        </div>
    </div>
  </section>

  <!-- 工作区 -->
  <div id="workspace" hidden>
    <header class="admin-topbar">
      <div class="container admin-topbar-inner">
        <a class="brand" href="../" title="返回站点">
          <span class="brand-icon">📝</span>
          <span>管理后台</span>
        </a>
        <div class="topbar-right">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换主题">🌗</button>
          <span class="repo-badge" id="repoBadge" hidden></span>
          <button class="btn-ghost" id="disconnectBtn">断开</button>
        </div>
      </div>
    </header>

    <!-- 底部 Tab 栏（iOS 原生）：主页 / 文章 / 分类 / 设置
         注意：必须位于 .admin-topbar 之外，否则 topbar 的 backdrop-filter 会
         成为 position:fixed 的包含块，导致「底部」Tab 栏钉在顶部。 -->
    <nav class="side-nav" aria-label="后台导航">
      <button data-view="home" class="tab-home">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
        <span class="tab-label">主页</span>
      </button>
      <button data-view="posts" class="active">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg></span>
        <span class="tab-label">文章</span>
      </button>
      <button data-view="categories">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
        <span class="tab-label">分类</span>
      </button>
      <button data-view="settings">
        <span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="tab-label">设置</span>
      </button>
    </nav>

    <div class="repo-warn" id="repoWarn" role="alert" hidden></div>

    <main class="admin-main container" id="mainContent" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- 底部筛选 Sheet -->
  <div class="sheet-root" id="sheetRoot" hidden>
    <div class="sheet-mask" data-sheet-close></div>
    <section class="bottom-sheet" role="dialog" aria-modal="true" aria-label="筛选">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <button type="button" class="sheet-cancel" data-sheet-close>取消</button>
        <span class="sheet-title" id="sheetTitle">筛选</span>
        <button type="button" class="sheet-done" id="sheetDone">完成</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <script src="../assets/vendor/marked.min.js"></script>
  <script src="../assets/vendor/purify.min.js"></script>
  <script src="../assets/vendor/katex/katex.min.js"></script>
  <script src="../assets/vendor/hljs/highlight.min.js"></script>
  <script src="../assets/v1786199851/gh.js"></script>
  <script src="../assets/v1786199851/md.js"></script>
  <script src="../assets/v1786199851/admin.js"></script>
</body>
</html>
